<style>
  :root, [data-theme="sea"]{
    --ink:#0E2A2E; --ink-soft:#4C7A78;
    --bg:#EAF7F4; --panel:#FFFFFF; --panel-alt:#D8F0EA;
    --moss:#0E7C86; --moss-light:#3FC9B4;
    --saffron:#F2A73B; --plum:#E85D75;
    --line: rgba(14,42,46,0.14); --radius: 8px;
  }
  [data-theme="citrus"]{
    --ink:#2B1B05; --ink-soft:#8A6A3D;
    --bg:#FFF6E8; --panel:#FFFFFF; --panel-alt:#FCE7C2;
    --moss:#E8850C; --moss-light:#B7D336;
    --saffron:#F2A73B; --plum:#D1454A;
    --line: rgba(43,27,5,0.14); --radius: 8px;
  }
  [data-theme="berry"]{
    --ink:#2B0F1E; --ink-soft:#8A5470;
    --bg:#FDF1F6; --panel:#FFFFFF; --panel-alt:#F6DCE8;
    --moss:#A32158; --moss-light:#F06BA0;
    --saffron:#E8A33D; --plum:#6B2545;
    --line: rgba(43,15,30,0.14); --radius: 8px;
  }
  [data-theme="earth"]{
    --ink:#232520; --ink-soft:#5b5c53;
    --bg:#F5F1E4; --panel:#FFFFFF; --panel-alt:#ECE6D4;
    --moss:#46603F; --moss-light:#7C9B6F;
    --saffron:#CE9A34; --plum:#7A3B4E;
    --line: rgba(35,37,32,0.14); --radius: 8px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{ background:var(--bg); color:var(--ink); font-family:'Work Sans', sans-serif; -webkit-font-smoothing:antialiased; min-height:100vh; }
  .serif{ font-family:'Fraunces', serif; }
  #app{ max-width:760px; margin:0 auto; padding:0 0 60px; }

  header.top{ padding:24px 20px 14px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--line); }
  .brand{ font-family:'Fraunces', serif; font-style:italic; font-weight:500; font-size:24px; letter-spacing:-0.01em; }
  .brand span{ color:var(--moss); font-style:normal; }
  .streakpill{ display:flex; align-items:center; gap:5px; background:var(--panel-alt); border-radius:20px; padding:6px 12px; font-size:13px; font-weight:600; }

  nav.navicons{ display:flex; gap:2px; padding:10px 8px 0; border-bottom:1px solid var(--line); overflow-x:auto; }
  nav.navicons button{
    display:flex; flex-direction:column; align-items:center; gap:4px;
    background:none; border:none; cursor:pointer; color:var(--ink-soft);
    padding:8px 12px 10px; font-family:'Work Sans',sans-serif; font-size:10.5px; font-weight:500;
    border-bottom:2px solid transparent; flex-shrink:0; white-space:nowrap;
  }
  nav.navicons button svg{ stroke:var(--ink-soft); }
  nav.navicons button.active{ color:var(--ink); border-bottom-color:var(--moss); }
  nav.navicons button.active svg{ stroke:var(--moss); }

  main{ padding:22px 20px; }

  .hero{ display:flex; align-items:flex-end; gap:14px; margin-bottom:6px; }
  .hero .num{ font-family:'Fraunces', serif; font-size:52px; line-height:1; font-weight:500; font-variant-numeric: tabular-nums; }
  .hero .of{ font-size:15px; color:var(--ink-soft); padding-bottom:8px; }
  .hero-note{ font-family:'Fraunces', serif; font-style:italic; font-size:14px; color:var(--moss); margin-bottom:20px; }

  .kpi-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:22px; }
  .kpi-card{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:13px 14px; }
  .kpi-card .lbl{ font-size:11.5px; color:var(--ink-soft); margin-bottom:4px; display:flex; align-items:center; gap:5px; }
  .kpi-card .val{ font-size:18px; font-weight:600; font-variant-numeric:tabular-nums; }
  .kpi-card .sub{ font-size:11px; color:var(--ink-soft); }

  .macrorow{ display:flex; gap:10px; margin-bottom:22px; }
  .macrochip{ flex:1; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:12px 14px; }
  .macrochip .lbl{ font-size:12px; color:var(--ink-soft); margin-bottom:4px; }
  .macrochip .val{ font-size:16px; font-weight:600; font-variant-numeric: tabular-nums; }

  .section-title{ font-family:'Fraunces', serif; font-size:18px; font-weight:500; margin:26px 0 12px; display:flex; align-items:center; justify-content:space-between; }
  .section-sub{ font-size:12px; color:var(--ink-soft); font-weight:400; font-family:'Work Sans',sans-serif; }

  .nutrient{ margin-bottom:13px; }
  .nutrient .top-row{ display:flex; justify-content:space-between; font-size:13px; margin-bottom:5px; }
  .nutrient .name{ font-weight:500; }
  .nutrient .amt{ color:var(--ink-soft); font-variant-numeric: tabular-nums; }
  .bar-track{ height:6px; background:var(--panel-alt); border-radius:4px; overflow:hidden; }
  .bar-fill{ height:100%; border-radius:4px; transition:width .4s ease; }
  .fill-good{ background:var(--moss); } .fill-mid{ background:var(--saffron); } .fill-low{ background:var(--plum); }

  .link-btn{ background:none; border:none; color:var(--moss); font-size:13px; font-weight:500; cursor:pointer; padding:0; text-decoration:underline; text-underline-offset:2px; }
  .panel{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:16px; margin-bottom:14px; }
  .panel > .panel-title{ font-family:'Fraunces',serif; font-size:16px; font-weight:500; margin-bottom:12px; }
  .panel > .panel-note{ font-size:12px; color:var(--ink-soft); margin:-6px 0 14px; }

  .logrow{ display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); font-size:14px; }
  .logrow:last-child{ border-bottom:none; }
  .logrow .name{ font-weight:500; } .logrow .meta{ font-size:12px; color:var(--ink-soft); }
  .logrow .cal{ font-variant-numeric: tabular-nums; color:var(--ink-soft); font-size:13px; }
  .del{ background:none;border:none;color:var(--plum);cursor:pointer;font-size:12px;margin-left:10px; }
  .entrydetail{ padding:4px 0 14px; border-bottom:1px solid var(--line); }
  .detail-macros{ display:flex; gap:16px; font-size:12.5px; color:var(--ink-soft); margin-bottom:10px; }
  .detail-macros b{ color:var(--ink); font-weight:600; }
  .detail-micro{ display:flex; flex-wrap:wrap; gap:6px; }
  .micropill{ font-size:11px; background:var(--panel-alt); border-radius:12px; padding:4px 10px; color:var(--ink-soft); }

  .log-input-row{ display:flex; gap:8px; margin-bottom:16px; }
  .log-input-row input{ flex:1; padding:13px 14px; border:1px solid var(--line); border-radius:var(--radius); font-family:'Work Sans', sans-serif; font-size:14px; background:var(--panel); }
  .log-input-row input:focus{ outline:2px solid var(--moss-light); outline-offset:1px; }
  .icon-btn{ width:46px; height:46px; border-radius:var(--radius); border:1px solid var(--line); background:var(--panel); cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .icon-btn.mic-on{ background:var(--plum); border-color:var(--plum); animation: micPulse 1.4s infinite; }
  @keyframes micPulse{ 0%{ box-shadow:0 0 0 0 rgba(0,0,0,0.22); } 70%{ box-shadow:0 0 0 16px rgba(0,0,0,0); } 100%{ box-shadow:0 0 0 0 rgba(0,0,0,0); } }
  .listen-dot{ width:9px; height:9px; border-radius:50%; background:var(--plum); animation: blinkDot 1s infinite; }
  @keyframes blinkDot{ 0%,100%{ opacity:1; } 50%{ opacity:.25; } }
  .voice-live{ background:var(--panel-alt); border-radius:var(--radius); padding:10px 14px; font-size:13.5px; color:var(--ink); min-height:20px; max-width:320px; text-align:center; font-style:italic; }

  .spinner{ width:28px; height:28px; border:3px solid var(--panel-alt); border-top-color:var(--moss); border-radius:50%; animation:spin .8s linear infinite; margin:0 auto 12px; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .toast{ position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--bg);
    padding:12px 16px; border-radius:24px; font-size:13.5px; box-shadow:0 6px 20px rgba(0,0,0,.28); z-index:80;
    max-width:88%; display:flex; align-items:center; gap:14px; animation:toastIn .25s ease; }
  @keyframes toastIn{ from{ opacity:0; transform:translateX(-50%) translateY(8px); } to{ opacity:1; transform:translateX(-50%) translateY(0); } }
  .toast button{ background:none; border:none; color:var(--moss-light); font-weight:700; font-size:13px; cursor:pointer; flex-shrink:0; }

  nav.navicons{ position:relative; }
  nav.navicons::after{ content:""; position:absolute; top:0; right:0; bottom:0; width:28px; pointer-events:none;
    background:linear-gradient(to right, rgba(0,0,0,0), var(--bg)); }
  .primary-btn{ background:var(--moss); color:white; border:none; border-radius:var(--radius); padding:13px 18px; font-family:'Work Sans', sans-serif; font-size:14px; font-weight:600; cursor:pointer; }
  .primary-btn:disabled{ opacity:.5; cursor:default; }
  .ghost-btn{ background:none; border:1px solid var(--line); border-radius:var(--radius); padding:10px 14px; font-size:13px; cursor:pointer; color:var(--ink); }
  .hint{ font-size:12px; color:var(--ink-soft); margin-top:-8px; margin-bottom:18px; }
  .status-msg{ font-size:13px; color:var(--moss); margin-bottom:14px; font-style:italic; font-family:'Fraunces',serif; }
  .status-msg.err{ color:var(--plum); }

  label.field{ display:block; margin-bottom:16px; }
  label.field .flbl{ font-size:12px; color:var(--ink-soft); margin-bottom:5px; display:block; }
  label.field input, label.field select{ width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:var(--radius); font-family:'Work Sans', sans-serif; font-size:14px; background:var(--panel); }
  .field-row{ display:flex; gap:12px; }
  .field-row > label{ flex:1; }

  .chiprow{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px; }
  .chip{ padding:8px 13px; border:1px solid var(--line); border-radius:20px; font-size:13px; cursor:pointer; background:var(--panel); user-select:none; }
  .chip.on{ background:var(--moss); color:white; border-color:var(--moss); }

  .suggestion-card{ border:1px solid var(--line); border-radius:var(--radius); padding:16px; margin-bottom:12px; background:var(--panel); }
  .suggestion-card .sname{ font-family:'Fraunces',serif; font-size:17px; font-weight:500; margin-bottom:4px; }
  .suggestion-card .sreason{ font-size:13px; color:var(--ink-soft); margin-bottom:10px; line-height:1.4; }
  .suggestion-card .sfoot{ display:flex; justify-content:space-between; align-items:center; }
  .suggestion-card .scal{ font-size:12px; color:var(--ink-soft); }

  .empty{ text-align:center; padding:36px 20px; color:var(--ink-soft); }
  .empty .serif{ font-size:17px; color:var(--ink); display:block; margin-bottom:6px; }
  footer.disclaimer{ font-size:11px; color:var(--ink-soft); text-align:center; padding:20px; }

  .logo-mark{ flex-shrink:0; }
  .theme-grid{ display:flex; flex-wrap:wrap; gap:10px; margin-bottom:18px; }
  .theme-swatch{ border:2px solid var(--line); border-radius:12px; padding:10px 12px; cursor:pointer; display:flex; align-items:center; gap:8px; background:var(--panel); font-size:12.5px; font-weight:500; }
  .theme-swatch.on{ border-color:var(--ink); }
  .theme-dots{ display:flex; }
  .theme-dots span{ width:14px; height:14px; border-radius:50%; display:inline-block; margin-left:-4px; border:1.5px solid var(--panel); }
  .theme-dots span:first-child{ margin-left:0; }
  .chatlist{ display:flex; flex-direction:column; gap:10px; max-height:56vh; overflow-y:auto; padding:4px 2px 10px; margin-bottom:14px; }
  .bubble{ max-width:82%; padding:10px 14px; border-radius:14px; font-size:14px; line-height:1.45; white-space:pre-wrap; }
  .bubble.user{ align-self:flex-end; background:var(--moss); color:#fff; border-bottom-right-radius:4px; }
  .bubble.assistant{ align-self:flex-start; background:var(--panel-alt); color:var(--ink); border-bottom-left-radius:4px; }
  .chat-input-row{ display:flex; gap:8px; }

  .waterglasses{ display:flex; flex-wrap:wrap; gap:8px; margin:16px 0 20px; }
  .glass{ width:30px; height:38px; border:2px solid var(--moss); border-radius:2px 2px 8px 8px; position:relative; overflow:hidden; }
  .glass.full{ background:var(--moss-light); }
  .quickadd-row{ display:flex; gap:10px; margin-bottom:18px; flex-wrap:wrap; }
  .quickadd-row button{ flex:1; min-width:90px; }

  .xpbar-wrap{ margin-bottom:8px; }
  .xpbar-track{ height:10px; background:var(--panel-alt); border-radius:6px; overflow:hidden; }
  .xpbar-fill{ height:100%; background:var(--saffron); border-radius:6px; }
  .levelrow{ display:flex; justify-content:space-between; font-size:12px; color:var(--ink-soft); margin-bottom:6px; }

  .badge-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:6px; }
  .badge{ text-align:center; padding:14px 6px; border-radius:var(--radius); border:1px solid var(--line); background:var(--panel); }
  .badge.locked{ opacity:.35; }
  .badge .bicon{ font-size:26px; display:block; margin-bottom:6px; }
  .badge .bname{ font-size:11px; font-weight:600; }
  .badge .bdesc{ font-size:9.5px; color:var(--ink-soft); margin-top:2px; line-height:1.3; }

  .streakcard{ display:flex; gap:12px; margin-bottom:20px; }
  .streakbox{ flex:1; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:16px; text-align:center; }
  .streakbox .snum{ font-family:'Fraunces',serif; font-size:32px; font-weight:500; }
  .streakbox .slbl{ font-size:11px; color:var(--ink-soft); margin-top:2px; }

  .reporttable{ width:100%; border-collapse:collapse; font-size:13px; margin-bottom:14px; }
  .reporttable th{ text-align:left; font-size:11px; color:var(--ink-soft); font-weight:500; padding:6px 8px; border-bottom:1px solid var(--line); }
  .reporttable td{ padding:8px; border-bottom:1px solid var(--line); }
  .pill{ font-size:10.5px; padding:3px 9px; border-radius:12px; font-weight:600; }
  .pill.low{ background:rgba(122,59,78,.12); color:var(--plum); }
  .pill.normal{ background:rgba(70,96,63,.12); color:var(--moss); }
  .pill.high{ background:rgba(206,154,52,.18); color:#8a6417; }
  .filerow{ border:1.5px dashed var(--line); border-radius:var(--radius); padding:20px; text-align:center; margin-bottom:16px; }
  .filerow input{ margin-top:10px; }

  .goalgroup-title{ font-family:'Fraunces',serif; font-size:16px; font-weight:500; margin-bottom:2px; }
  .goalgroup-tag{ font-size:11px; color:var(--moss); font-weight:600; margin-bottom:10px; display:block; }
</style>
</head>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";

/* ================= Firebase project config =================
   Paste the config object from your Firebase project's web app settings here.
   Firebase Console -> Project settings -> General -> Your apps -> SDK setup and configuration
*/
const FIREBASE_CONFIG = {
  apiKey: "PASTE_YOUR_API_KEY",
  authDomain: "PASTE_YOUR_PROJECT_ID.firebaseapp.com",
  projectId: "PASTE_YOUR_PROJECT_ID",
  storageBucket: "PASTE_YOUR_PROJECT_ID.appspot.com",
  messagingSenderId: "PASTE_YOUR_SENDER_ID",
  appId: "PASTE_YOUR_APP_ID"
};
const firebaseApp = initializeApp(FIREBASE_CONFIG);
const auth = getAuth(firebaseApp);
const db = getFirestore(firebaseApp);
let currentUser = null;

/* Drop-in replacement for the old cloudStorage API, backed by Firestore
   under users/{uid}/data/{key} so each signed-in Google account gets its own data. */
const cloudStorage = {
  async get(key, shared){
    if(!currentUser) throw new Error("not signed in");
    const ref = doc(db, "users", currentUser.uid, "data", key);
    const snap = await getDoc(ref);
    if(!snap.exists()) throw new Error("not found");
    return { key, value: snap.data().value, shared: !!shared };
  },
  async set(key, value, shared){
    if(!currentUser) return null;
    const ref = doc(db, "users", currentUser.uid, "data", key);
    await setDoc(ref, { value });
    return { key, value, shared: !!shared };
  }
};
async function signIn(){
  try{ await signInWithPopup(auth, new GoogleAuthProvider()); }
  catch(e){ alert("Sign-in failed: " + e.message); }
}
async function signOutUser(){ await signOut(auth); }

/* ================= constants ================= */
const CONDITIONS = ["Anemia","Iron deficiency","Vitamin D deficiency","B12 deficiency","Thyroid issue","PCOS","Diabetes",

  "High cholesterol","High blood pressure","None of these"];

const GOALS = [
  {v:"lose", l:"Lose weight"}, {v:"maintain", l:"Maintain weight"}, {v:"gain", l:"Gain muscle"},
  {v:"deficiency", l:"Fix a deficiency"}, {v:"hair", l:"Reduce hair fall"}, {v:"skin", l:"Improve skin health"},
  {v:"energy", l:"Boost energy levels"}, {v:"gut", l:"Improve gut health"}, {v:"sleep", l:"Sleep better"},
  {v:"immunity", l:"Build immunity"}, {v:"heart", l:"Heart health"}, {v:"prenatal", l:"Prenatal / postpartum nutrition"},
  {v:"general", l:"General healthy eating"}
];

const BASE_RDA = {

  "Iron deficiency": {"Iron":1.6,"Vitamin C":1.2},
  "Vitamin D deficiency": {"Vitamin D":1.6},

  "Thyroid issue": {"Zinc":1.2,"Iron":1.2},
  "PCOS": {"Vitamin D":1.3,"Magnesium":1.2,"Vitamin B12":1.2},

  "Osteoporosis": {"Calcium":1.3,"Vitamin D":1.5,"Magnesium":1.2},

  "Acne / skin issues": {"Vitamin A":1.3,"Zinc":1.3,"Vitamin E":1.2,"Omega-3":1.3,"Vitamin C":1.2},
  "Dry / dull skin": {"Vitamin E":1.3,"Omega-3":1.3,"Vitamin A":1.2},

  "Dandruff": {"Zinc":1.3,"Biotin":1.2,"Omega-3":1.2},
  "High cholesterol": {"Fiber":1.3},
  "High blood pressure": {"Potassium":1.3,"Magnesium":1.2}
};
const GOAL_BOOST = {
  "hair": {"Biotin":1.4,"Iron":1.3,"Zinc":1.2,"Vitamin D":1.2},
  "skin": {"Vitamin A":1.3,"Vitamin C":1.2,"Vitamin E":1.2,"Zinc":1.2,"Omega-3":1.2},
  "energy": {"Vitamin B12":1.3,"Iron":1.3,"Magnesium":1.2},

/* ================= nutrition math ================= */
function calcTargets(p){
  const bmr = p.sex==="male" ? 10*p.weightKg + 6.25*p.heightCm - 5*p.age + 5 : 10*p.weightKg + 6.25*p.heightCm - 5*p.age - 161;
  const actMult = {sedentary:1.2, light:1.375, moderate:1.55, active:1.725, very_active:1.9}[p.activity] || 1.4;
  const goals = p.goals || [];
  let tdee = bmr * actMult;
  if(goals.includes("gain")) tdee *= 1.12;
  else if(goals.includes("lose")) tdee *= 0.85;
  const calories = Math.round(tdee);
  let proteinPct=0.25, carbPct=0.45, fatPct=0.30;
  const macroPriority = ["gain","lose","hair"];
  for(const g of macroPriority){ if(goals.includes(g) && GOAL_MACRO_PROFILE[g]){ proteinPct=GOAL_MACRO_PROFILE[g].p; carbPct=GOAL_MACRO_PROFILE[g].c; fatPct=GOAL_MACRO_PROFILE[g].f; break; } }
  let protein = Math.round(calories*proteinPct/4);
  const carbs = Math.round(calories*carbPct/4);
  const fat = Math.round(calories*fatPct/9);

  const micro = {}; const priority = {};
  for(const [k,v] of Object.entries(BASE_RDA)){
    let mult = 1;
    (p.conditions||[]).forEach(c=>{ if(CONDITION_BOOST[c] && CONDITION_BOOST[c][k]) mult = Math.max(mult, CONDITION_BOOST[c][k]); });
    goals.forEach(g=>{ if(GOAL_BOOST[g] && GOAL_BOOST[g][k]) mult = Math.max(mult, GOAL_BOOST[g][k]); });
    if(p.bloodFlags && p.bloodFlags[k]) mult = Math.max(mult, p.bloodFlags[k]);
    micro[k] = { amt: Math.round(v.amt*mult*10)/10, unit: v.unit };
    priority[k] = mult;
  }
  (DIET_PRIORITY[p.dietType]||[]).forEach(k=>{ priority[k] = Math.max(priority[k]||1, 1.2); });
  return { calories, protein, carbs, fat, micro, priority };
}
function toNum(v){ const n = typeof v === 'number' ? v : parseFloat(v); return isFinite(n) ? n : 0; }
function cleanMicro(m){ const out={}; Object.entries(m||{}).forEach(([k,v])=>{ const n=toNum(v); if(n) out[k]=n; }); return out; }
function sumTotals(entries){
  const t = {calories:0, protein:0, carbs:0, fat:0, micro:{}};
  entries.forEach(e=>{
    t.calories += toNum(e.calories); t.protein += toNum(e.protein); t.carbs += toNum(e.carbs); t.fat += toNum(e.fat);
    Object.entries(e.micro||{}).forEach(([k,v])=>{ t.micro[k] = (t.micro[k]||0) + toNum(v); });
  });
  return t;
}
function fmt(n){ return Math.round(toNum(n)*10)/10; }
function fillClass(pct){ if(pct>=0.8) return "fill-good"; if(pct>=0.4) return "fill-mid"; return "fill-low"; }
function renderNutrientRow(name, have, target, unit){

/* ================= IFCT 2017 Indian food data ================= */
const IFCT_CODE_CANDIDATES = {
  "Iron": ["fe"], "Calcium": ["ca"], "Vitamin C": ["vitc"], "Folate": ["folsum","fol"],
  "Vitamin B12": ["vitb12","cbl"], "Vitamin A": ["vita","retol"], "Vitamin E": ["vite"],
  "Vitamin B6": ["vitb6","pyrxn"], "Zinc": ["zn"], "Magnesium": ["mg"], "Potassium": ["k"],
  "Fiber": ["fibtg"], "Vitamin D": ["vitd","chocal"]
};
const IFCT_MACRO_CANDIDATES = { calories:["enerc","enerkcal"], protein:["protcnt","prot"], fat:["fatce","fat"], carbs:["choavldf","cho"] };

function parseCsvLine(line){
  const out = []; let cur = ""; let inQ = false;
  for(let i=0;i<line.length;i++){
    const ch = line[i];
    if(ch==='"'){ inQ = !inQ; continue; }
    if(ch===',' && !inQ){ out.push(cur); cur=""; continue; }
    cur += ch;
  }
  out.push(cur);
  return out;
}
function parseIfctCsv(text){
  const lines = text.split(/\r?\n/).filter(l=>l.trim().length>0);
  if(lines.length<2) return {header:[], rows:[]};
  const header = parseCsvLine(lines[0]).map(h=>h.trim().toLowerCase());
  const rows = lines.slice(1).map(l=>{
    const cells = parseCsvLine(l);
    const row = {}; header.forEach((h,i)=>{ row[h] = cells[i]!==undefined ? cells[i].trim() : ""; });
    return row;
  });
  return { header, rows };
}
async function loadIfct(){
  if(ifctCache) return ifctCache;
  try{
    const res = await fetch("https://cdn.jsdelivr.net/npm/@ifct2017/compositions/index.csv");
    const text = await res.text();
    ifctCache = parseIfctCsv(text);
  }catch(e){ ifctCache = {header:[], rows:[]}; }
  return ifctCache;
}
function ifctFindColumn(header, candidates){ for(const c of candidates){ const i = header.indexOf(c); if(i>=0) return i; } return -1; }
function ifctRowValue(header, row, candidates){
  for(const c of candidates){ if(row[c]!==undefined && row[c]!=="" && !isNaN(parseFloat(row[c]))) return parseFloat(row[c]); }
  return null;
}
const IFCT_STOPWORDS = new Set(["and","with","some","bowl","cup","cups","piece","pieces","slice","slices","gram","grams","cooked","fresh","plain","little","bit","two","three","four","five","one","a","an","the","of","in","my","for","had","ate","some","today"]);

async function buildIfctReference(text){
  try{
    const ifct = await loadIfct();
    if(!ifct.rows.length) return "";
    const words = text.toLowerCase().replace(/[^a-z\s]/g," ").split(/\s+/).filter(w=>w.length>3 && !IFCT_STOPWORDS.has(w));
    const uniqueWords = [...new Set(words)].slice(0,8);
    const matched = new Map();
    uniqueWords.forEach(w=>{
      for(const row of ifct.rows){
        if(matched.size>=6) break;
        if((row.name||"").toLowerCase().includes(w)){ matched.set(row.name, row); break; }
      }
    });
    if(matched.size===0) return "";
    const lines = [];
    matched.forEach(row=>{
      const parts = [];
      Object.entries(IFCT_CODE_CANDIDATES).forEach(([label,cands])=>{
        const v = ifctRowValue(ifct.header, row, cands);
        if(v!==null) parts.push(`${label} ${v}`);
      });
      if(parts.length) lines.push(`${row.name}: ${parts.join(", ")} (per 100g, IFCT 2017 lab data)`);
    });
    return lines.length ? `Reference lab data for possibly relevant raw Indian ingredients (use these exact values, scaled to quantity, if the logged food matches one closely; otherwise use your own estimate for cooked/composite dishes):\n${lines.join("\n")}` : "";
  }catch(e){ return ""; }
}

const GEMINI_MODELS = ["gemini-flash-latest", "gemini-2.5-flash", "gemini-2.0-flash"];
function isOverloadError(err, httpStatus){
  const msg = ((err && err.message) || "").toLowerCase();
  if(httpStatus === 503 || httpStatus === 429) return true;
  return /overloaded|high demand|unavailable|try again|rate limit|resource_exhausted|quota/.test(msg);
}
function sleep(ms){ return new Promise(r=>setTimeout(r, ms)); }
async function callGeminiOnce(model, system, contents, apiKey, maxTokens){
  const body = { system_instruction:{ parts:[{ text: system }] }, contents, generationConfig:{ maxOutputTokens: maxTokens||1200 } };
  let res;
  try{
    res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`, {
      method:"POST", headers:{ "Content-Type":"application/json", "x-goog-api-key": apiKey },
      body: JSON.stringify(body)
    });
  }catch(networkErr){
    const e = new Error("Network error reaching Gemini — check your connection.");
    e.retryable = true;
    throw e;
  }
  const data = await res.json().catch(()=> ({}));
  if(data.error){
    const e = new Error("Gemini error: " + (data.error.message || `HTTP ${res.status}`));
    e.retryable = isOverloadError(e, res.status) || !res.ok;
    throw e;
  }
  if(!res.ok){
    const e = new Error(`Gemini HTTP ${res.status}`);
    e.retryable = isOverloadError(e, res.status);
    throw e;
  }
  const cand = data.candidates && data.candidates[0];
  if(cand && cand.finishReason && cand.finishReason!=="STOP" && cand.finishReason!=="MAX_TOKENS"){
    const e = new Error("Gemini blocked this response (" + cand.finishReason + ") — try rephrasing.");
    e.retryable = false;
    throw e;
  }
  const text = (cand && cand.content && cand.content.parts) ? cand.content.parts.map(p=>p.text||"").join("\n") : "";
  if(!text){
    const e = new Error("Gemini returned an empty response — try again.");
    e.retryable = true;
    throw e;
  }
  return text.trim();
}
async function callGeminiRaw(system, contents, apiKey, maxTokens){
  const MAX_ATTEMPTS_PER_MODEL = 3;
  let lastErr = null;
  for(let m=0; m<GEMINI_MODELS.length; m++){
    const model = GEMINI_MODELS[m];
    for(let attempt=0; attempt<MAX_ATTEMPTS_PER_MODEL; attempt++){
      try{
        return await callGeminiOnce(model, system, contents, apiKey, maxTokens);
      }catch(err){
        lastErr = err;
        if(!err.retryable){ throw err; }
        const isLastAttemptForModel = attempt === MAX_ATTEMPTS_PER_MODEL - 1;
        if(!isLastAttemptForModel){
          const backoffMs = 600 * Math.pow(2, attempt) + Math.random()*300;
          await sleep(backoffMs);
        }
      }
    }
    // exhausted retries on this model — fall through to next model alias, if any
  }
  const friendly = new Error("Gemini is under heavy load right now (its free tier gets overloaded sometimes). Please try again in a bit — your input wasn't lost, just retry the same action.");
  friendly.retryable = true;
  friendly.cause = lastErr;
  throw friendly;
}
async function callGemini(system, input, maxTokens, apiKey){
  const parts = [];
  if(typeof input === 'string'){ parts.push({ text: input }); }
  else{
    if(input.pdfBase64) parts.push({ inline_data: { mime_type:"application/pdf", data: input.pdfBase64 } });
    if(input.text) parts.push({ text: input.text });
  }
  return await callGeminiRaw(system, [{ role:"user", parts }], apiKey, maxTokens);
}
function anthropicContentFromInput(input){
  if(typeof input === 'string') return input;
  const blocks = [];
  if(input.pdfBase64) blocks.push({ type:"document", source:{ type:"base64", media_type:"application/pdf", data: input.pdfBase64 } });
  if(input.text) blocks.push({ type:"text", text: input.text });
  return blocks;
}
async function callLLM(system, input, maxTokens){
  const key = state.settings && state.settings.geminiApiKey;
  if(!key) throw new Error("Add a free Gemini API key in Profile → AI settings to use this feature.");
  return await callGemini(system, input, maxTokens, key);
}
let lastParseWasTruncated = false;
function extractJson(text){
  lastParseWasTruncated = false;
  let t = text.replace(/```json|```/g,"").trim();
  const bIdx = t.indexOf('['); const oIdx = t.indexOf('{');
  const isArr = bIdx!==-1 && (oIdx===-1 || bIdx<oIdx);
  const start = isArr ? bIdx : oIdx;
  if(start===-1) throw new Error("No JSON found in the response.");
  const end = t.lastIndexOf(isArr ? ']' : '}');
  t = end>start ? t.slice(start, end+1) : t.slice(start);
  try{
    return JSON.parse(t);
  }catch(parseErr){
    if(isArr){
      const repaired = repairTruncatedArray(t);
      if(repaired && repaired.length){ lastParseWasTruncated = true; return repaired; }
    }
    throw parseErr;
  }
}
function repairTruncatedArray(t){
  for(let i = t.lastIndexOf('}'); i > 0; i = t.lastIndexOf('}', i-1)){
    try{ return JSON.parse(t.slice(0, i+1) + "]"); }catch(e){ /* try an earlier closing point */ }
  }
  return null;
}

function describeParseError(e){
  const msg = (e && e.message) || "";
  if(msg.includes("heavy load") || msg.includes("overloaded")) return msg;
  if(msg.includes("Gemini API key")) return msg;
  if(msg.includes("Gemini error") || msg.includes("Gemini blocked") || msg.includes("empty response")) return msg;
  if(msg.includes("No JSON found")) return "The AI's response wasn't readable data — try again, or rephrase more simply.";
  if(msg.toLowerCase().includes("fetch") || msg.toLowerCase().includes("network")) return "Couldn't reach Gemini — check your internet connection and try again.";
  return `Couldn't parse that${msg ? " (" + msg + ")" : ""} — try rephrasing, e.g. "two rotis, dal, and a bowl of curd".`;
}

let recognition = null;
let silenceTimer = null;
function resetSilenceTimer(){
  if(silenceTimer) clearTimeout(silenceTimer);
  silenceTimer = setTimeout(()=>{ finishVoice(); }, 3500);
}

  if(state.listening){ finishVoice(); return; }
  startVoice();

function startVoice(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ state.addMsg = { ok:false, text:"Voice input isn't available in this browser — type your food instead." }; render(); return; }
  try{
    recognition = new SR();
    recognition.lang = "en-US";
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.maxAlternatives = 1;
    state.voiceFinal = ""; state.voiceInterim = ""; state.addMsg = null;
    recognition.onresult = (e)=>{
      let interim = ""; let finalChunk = "";
      for(let i = e.resultIndex; i < e.results.length; i++){
        const t = e.results[i][0].transcript;
        if(e.results[i].isFinal) finalChunk += t + " "; else interim += t;
      }
      if(finalChunk) state.voiceFinal += finalChunk;
      state.voiceInterim = interim;
      resetSilenceTimer();
      render();
    };
    recognition.onerror = ()=>{
      state.listening = false; if(silenceTimer){ clearTimeout(silenceTimer); silenceTimer=null; }
      state.addMsg = { ok:false, text:"Didn't catch that, or mic access was blocked — try typing instead." };
      render();
    };
    recognition.onend = ()=>{ if(state.listening) finalizeVoice(); };
    recognition.start();
    state.listening = true;
    render();
    resetSilenceTimer();
  }catch(err){
    state.listening = false;
    state.addMsg = { ok:false, text:"Voice input isn't available in this preview — try typing instead." };
    render();
  }
}
function finishVoice(){
  if(recognition){ try{ recognition.stop(); }catch(e){} }
  finalizeVoice();
}

  if(silenceTimer){ clearTimeout(silenceTimer); silenceTimer=null; }
  state.listening = false;

async function readFileAsText(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>rej(new Error("read failed")); r.readAsText(file); }); }
async function readFileAsArrayBuffer(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>rej(new Error("read failed")); r.readAsArrayBuffer(file); }); }

async function getHealthXmlText(file){
  if(/\.zip$/i.test(file.name)){
    const buf = await readFileAsArrayBuffer(file);
    const zip = await JSZip.loadAsync(buf);
    let entry = zip.file(/export\.xml$/i)[0];
    if(!entry) throw new Error("no export.xml found in archive");
    return await entry.async("string");
  }
  return await readFileAsText(file);
}

function parseActiveEnergyByDate(xmlText){
  const doc = new DOMParser().parseFromString(xmlText, "application/xml");
  const records = doc.querySelectorAll('Record[type="HKQuantityTypeIdentifierActiveEnergyBurned"]');
  const byDate = {};
  records.forEach(r=>{
    const start = r.getAttribute('startDate') || "";
    const date = start.slice(0,10);
    const val = parseFloat(r.getAttribute('value')) || 0;
    if(date) byDate[date] = (byDate[date]||0) + val;
  });
  return byDate;
}

function buildDataSnapshot(){
  const p = state.profile; const targets = calcTargets(p);
  const totals = sumTotals(todaysEntries());
  const wTotal = todaysWater().reduce((s,w)=>s+w.ml,0);
  const burned = burnedTotalToday();
  const recentFoods = todaysEntries().slice(-8).map(e=>`${e.name} (${Math.round(e.calories)} kcal)`).join(", ") || "none logged yet today";
  const microStatus = Object.keys(targets.micro).sort((a,b)=>targets.priority[b]-targets.priority[a]).slice(0,8)
    .map(k=>`${k} ${fmt(totals.micro[k]||0)}/${targets.micro[k].amt}${targets.micro[k].unit}`).join(", ");
  return `Name: ${p.name||"the user"}. ${p.age}yo ${p.sex}, ${p.weightKg}kg. Region: ${p.region}. Diet type: ${p.dietType}. Goals: ${(p.goals||[]).map(g=>(GOALS.find(x=>x.v===g)||{}).l||g).join(", ")||"none set"}. Health conditions: ${(p.conditions||[]).join(", ")||"none"}.
Today (${todayStr()}): ${Math.round(totals.calories)}/${targets.calories} kcal eaten, protein ${fmt(totals.protein)}/${targets.protein}g, carbs ${fmt(totals.carbs)}/${targets.carbs}g, fat ${fmt(totals.fat)}/${targets.fat}g.
Water: ${wTotal}/${waterTargetMl()}ml. Calories burned today: ${burned}kcal.
Foods logged today: ${recentFoods}.
Priority nutrient status today: ${microStatus}.
Food logging streak: ${foodStreak()} days. Water goal streak: ${waterStreak()} days.
${p.bloodDate ? `Last blood report applied ${p.bloodDate}: ${p.bloodSummary}` : "No blood report on file."}`;
}

function extractAgentAction(text){
  const idx = text.indexOf("ACTION:");
  if(idx===-1) return { reply: text, action: null };
  const reply = text.slice(0, idx).trim();
  try{ return { reply, action: JSON.parse(text.slice(idx+7).trim()) }; }
  catch(e){ return { reply, action: null }; }
}
function applyAgentAction(action){
  if(!action || !action.type) return;
  if(action.type==='food' && Array.isArray(action.items)){
    const now = new Date();
    action.items.forEach(it=>{
      state.entries.push({ id: Date.now()+"-"+Math.random().toString(36).slice(2,7), date: todayStr(), time: now.toTimeString().slice(0,5),
        name: it.name||"Food", quantity: it.quantity||"", calories: toNum(it.calories), protein: toNum(it.protein), carbs: toNum(it.carbs), fat: toNum(it.fat), micro: cleanMicro(it.micro) });
    });
    saveEntries(); awardXp(8*action.items.length); checkDailyBonus();
  }else if(action.type==='water' && action.ml){
    addWater(Math.round(action.ml));
  }else if(action.type==='burn' && action.kcal){
    state.burned.push({ id: Date.now()+"-"+Math.random().toString(36).slice(2,6), date: todayStr(), time:new Date().toTimeString().slice(0,5), kcal: Math.round(action.kcal), source:'manual', name: action.name||"" });
    saveBurned(); awardXp(5); checkDailyBonus();
  }
}

async function sendChatMessage(){
  const text = state.chatInput.trim();
  if(!text || state.chatSending) return;
  const key = state.settings && state.settings.geminiApiKey;
  state.chatMessages.push({ role:'user', text });
  state.chatInput = ""; state.chatSending = true; render();
  if(!key){
    state.chatMessages.push({ role:'assistant', text:"Add a free Gemini API key in Profile → AI settings first — that's what powers this tab." });
    state.chatSending = false; saveChat(); render(); return;
  }
  try{
    const snapshot = buildDataSnapshot();
    const system = `You are the in-app assistant for BurzinEats, a personal nutrition tracker for an Indian user. Be concise — default to 2-4 short sentences, or a brief bullet list only when giving multiple distinct recommendations. Never write long essays. Use the user's data below directly to answer specifically rather than giving generic advice. If, and only if, the user clearly asks you to log or add food, water, or exercise/calories burned, end your reply with a line starting exactly with "ACTION:" followed by one line of valid JSON in one of these shapes — food: {"type":"food","items":[{"name":str,"quantity":str,"calories":num,"protein":num,"carbs":num,"fat":num,"micro":{nutrient:num}}]}; water: {"type":"water","ml":num}; burn: {"type":"burn","kcal":num,"name":str}. Never include an ACTION line for questions, opinions, or anything not explicitly a logging request.\n\nUser's current data:\n${snapshot}`;
    const history = state.chatMessages.slice(-10).map(m=>({ role: m.role==='user' ? 'user' : 'model', parts:[{ text:m.text }] }));
    const raw = await callGeminiRaw(system, history, key, 500);
    const { reply, action } = extractAgentAction(raw);
    state.chatMessages.push({ role:'assistant', text: reply || "Done." });
    if(action) applyAgentAction(action);
  }catch(e){
    const msg = (e && e.message) || "";
    state.chatMessages.push({ role:'assistant', text: msg.includes("Gemini") ? msg : "Something went wrong reaching Gemini — try again in a moment." });
  }
  state.chatSending = false; saveChat(); render();
}

    <div class="suggestion-card"><div class="sname">${s.food}</div><div class="sreason">${s.reason}</div>
      <div class="sfoot"><span class="scal">${Math.round(s.calories||0)} kcal · ${Math.round(s.protein||0)}g protein</span>
      <button class="ghost-btn" data-action="addSuggestion" data-idx="${i}">Add to log</button></div></div>`).join("") :
    `<div class="empty"><span class="serif">No suggestions yet</span>Tap the button above once you've logged a meal or two today.</div>`}
  `;
}

function statusPill(status){
  const s = (status||"Unknown").toLowerCase();
  const cls = s==="low" ? "low" : s==="high" ? "high" : "normal";
  return `<span class="pill ${cls}">${status}</span>`;
}
function viewReports(){
  return `
  <div class="section-title" style="margin-top:0">Blood report</div>
  <div class="hint" style="margin-top:-4px">Upload a lab report PDF — we'll read the values and adjust your daily goals to close any gaps.</div>
  <div class="filerow">
    <div>${state.reportFileName || "No file selected"}</div>
    <input type="file" id="reportFileInput" accept="application/pdf"/>
  </div>
  <button class="primary-btn" data-action="analyzeReport" ${(!state.reportFile || state.reportAnalyzing)?"disabled":""}>${state.reportAnalyzing?"Reading report…":"Analyze report"}</button>
  ${state.reportMsg ? `<div class="status-msg ${state.reportMsg.ok?'':'err'}" style="margin-top:14px">${state.reportMsg.text}</div>` : ""}

  ${state.reportResult ? `
    <div class="section-title">What we found</div>
    <table class="reporttable"><thead><tr><th>Test</th><th>Value</th><th>Status</th></tr></thead>
    <tbody>${(state.reportResult.results||[]).map(r=>`<tr><td>${r.test}</td><td>${r.value} ${r.unit||""}</td><td>${statusPill(r.status)}</td></tr>`).join("")}</tbody></table>
    <div class="panel"><div class="panel-title">Summary</div><div style="font-size:13px;color:var(--ink-soft)">${state.reportResult.summary||""}</div></div>
    <button class="ghost-btn" data-action="applyReport">Apply results to my goals</button>
  ` : ""}

  ${state.profile.bloodDate ? `<div class="section-title">Last applied</div><div class="panel"><div style="font-size:13px;color:var(--ink-soft)">Applied on ${state.profile.bloodDate}. ${state.profile.bloodSummary||""}</div></div>` : ""}
  <footer class="disclaimer">This reads values from your report using AI and is for informational tracking only — not a diagnosis. Always follow your doctor's interpretation and advice.</footer>

  <div class="section-title">Apple Health import</div>
  <div class="hint" style="margin-top:-4px">From your iPhone: Health app → tap your profile photo → Export All Health Data. Upload the resulting .zip (or export.xml) here to back-fill calories burned.</div>
  <div class="filerow">
    <div>${state.healthFileName || "No file selected"}</div>
    <input type="file" id="healthFileInput" accept=".zip,.xml,application/zip,text/xml"/>
  </div>
  <button class="primary-btn" data-action="analyzeHealth" ${(!state.healthFile || state.healthImporting)?"disabled":""}>${state.healthImporting?"Reading export…":"Import calories burned"}</button>
  ${state.healthMsg ? `<div class="status-msg ${state.healthMsg.ok?'':'err'}" style="margin-top:14px">${state.healthMsg.text}</div>` : ""}
  <div class="hint" style="margin-top:14px">Large export files can take a little while to process in the browser — that's normal.</div>
  `;
}

function viewRewards(){
  const lv = levelInfo();
  const ctx = badgeContext();
  return `
  <div class="section-title" style="margin-top:0">Rewards</div>
  <div class="levelrow"><span>Level ${lv.level}</span><span>${lv.into} / ${lv.need} XP</span></div>
  <div class="xpbar-wrap"><div class="xpbar-track"><div class="xpbar-fill" style="width:${(lv.into/lv.need)*100}%"></div></div></div>
  <div class="hint" style="margin-top:10px">Earn XP by logging meals, drinking water, and hitting your daily benchmarks.</div>

  <div class="streakcard">
    <div class="streakbox"><div class="snum">${ctx.foodStreak}</div><div class="slbl">day food streak</div></div>
    <div class="streakbox"><div class="snum">${ctx.waterStreak}</div><div class="slbl">day water streak</div></div>
  </div>

  <div class="section-title">Badges</div>
  <div class="badge-grid">
    ${BADGE_DEFS.map(b=>{ const unlocked = state.gamestate.badges.includes(b.id);
      return `<div class="badge ${unlocked?'':'locked'}"><span class="bicon">${b.icon}</span><div class="bname">${b.name}</div><div class="bdesc">${b.desc}</div></div>`; }).join("")}
  </div>
  `;
}

function conditionsHtml(){ return CONDITIONS.map(c=>`<div class="chip ${state.profileDraft.conditions.includes(c)?'on':''}" data-action="chipCond" data-val="${c}">${c}</div>`).join(""); }
function goalsHtml(){ return GOALS.map(g=>`<div class="chip ${state.profileDraft.goals.includes(g.v)?'on':''}" data-action="chipGoal" data-val="${g.v}">${g.l}</div>`).join(""); }
function selectHtml(id, options, current){ return `<select id="${id}">${options.map(o=>`<option value="${o}" ${o===current?'selected':''}>${o}</option>`).join("")}</select>`; }

function viewProfile(){
  const d = state.profileDraft;
  return `
  <div class="section-title" style="margin-top:0">${state.profile.onboarded?"Your profile":"Let's set up your profile"}</div>
  <div class="hint" style="margin-top:-4px">This shapes your daily targets, benchmarks, and Indian food suggestions.</div>

  <label class="field"><span class="flbl">Name</span><input id="f_name" type="text" value="${d.name}"/></label>
  <div class="field-row">
    <label class="field"><span class="flbl">Age</span><input id="f_age" type="number" value="${d.age}"/></label>
    <label class="field"><span class="flbl">Sex</span><select id="f_sex"><option value="female" ${d.sex==='female'?'selected':''}>Female</option><option value="male" ${d.sex==='male'?'selected':''}>Male</option></select></label>
  </div>
  <div class="field-row">
    <label class="field"><span class="flbl">Weight (kg)</span><input id="f_weight" type="number" value="${d.weightKg}"/></label>
    <label class="field"><span class="flbl">Height (cm)</span><input id="f_height" type="number" value="${d.heightCm}"/></label>
  </div>
  <label class="field"><span class="flbl">Activity level</span>
    <select id="f_activity">
      <option value="sedentary" ${d.activity==='sedentary'?'selected':''}>Sedentary</option>
      <option value="light" ${d.activity==='light'?'selected':''}>Lightly active</option>
      <option value="moderate" ${d.activity==='moderate'?'selected':''}>Moderately active</option>
      <option value="active" ${d.activity==='active'?'selected':''}>Active</option>
      <option value="very_active" ${d.activity==='very_active'?'selected':''}>Very active</option>
    </select>
  </label>

  <span class="flbl" style="display:block;margin-bottom:8px">Goals (select all that apply)</span>
  <div class="chiprow">${goalsHtml()}</div>

  <div class="section-title" style="margin:22px 0 10px">Indian food preferences</div>
  <div class="field-row">
    <label class="field"><span class="flbl">Region</span><div id="regionWrap">${selectHtml('f_region', REGIONS, d.region)}</div></label>
    <label class="field"><span class="flbl">Diet type</span><div id="dietWrap">${selectHtml('f_diet', DIET_TYPES, d.dietType)}</div></label>
  </div>
  <div class="field-row">
    <label class="field"><span class="flbl">Staple</span><div id="stapleWrap">${selectHtml('f_staple', STAPLES, d.staple)}</div></label>
    <label class="field"><span class="flbl">Spice tolerance</span><div id="spiceWrap">${selectHtml('f_spice', SPICE_LEVELS, d.spiceTolerance)}</div></label>
  </div>

  <div class="section-title" style="margin:22px 0 10px">Health conditions or concerns</div>
  <div class="hint" style="margin-top:-6px">Includes skin and hair issues — these set specific daily nutrient benchmarks.</div>
  <div class="chiprow">${conditionsHtml()}</div>

  <button class="primary-btn" data-action="saveProfile">Save profile</button>

  <div class="section-title">Appearance</div>
  <div class="hint" style="margin-top:-4px">Pick a look — changes apply instantly.</div>
  <div class="theme-grid">
    ${THEMES.map(t=>`<div class="theme-swatch ${((state.settings&&state.settings.theme)||'sea')===t.v?'on':''}" data-action="setTheme" data-val="${t.v}">
      <span class="theme-dots">${t.dots.map(c=>`<span style="background:${c}"></span>`).join("")}</span>${t.l}
    </div>`).join("")}
  </div>

  <div class="section-title">AI settings</div>
  <div class="hint" style="margin-top:-4px">Required — add your free Gemini API key from Google AI Studio so food parsing, suggestions, and report reading work on this deployed app.</div>
  <label class="field"><span class="flbl">Gemini API key</span><input id="f_geminikey" type="password" value="${state.settingsDraft.geminiApiKey}" placeholder="Paste your key here"/></label>
  <button class="ghost-btn" data-action="saveSettings">Save key</button>
  <div class="hint" style="margin-top:14px">${state.settings.geminiApiKey ? "Gemini key saved — AI features are active." : "No key saved yet — AI features won't work until you add one."} Stored in your private cloud data, sent directly from your browser to Google when used.</div>

  <div class="section-title">Account</div>
  <div class="hint" style="margin-top:-4px">Signed in as ${currentUser ? (currentUser.email||currentUser.displayName||"your Google account") : "—"}. Your data syncs automatically to this account.</div>
  <button class="ghost-btn" data-action="signOut">Sign out</button>

  <footer class="disclaimer">This app gives general nutrition information, not medical advice. Talk to a doctor or dietitian about diagnosed conditions.</footer>
  `;
}

/* ================= main render ================= */
function render(){
  const app = document.getElementById('app');
  if(state.tab === 'signin'){
    app.innerHTML = `<header class="top"><div><div class="brand">Burzin<span>Eats</span></div></div></header>${viewSignIn()}`;
    return;
  }
  if(!state.loaded){ app.innerHTML = `<div class="empty"><div class="spinner"></div>Loading your data…</div>`; return; }

  let body = "";
  if(state.tab==="today") body = viewToday();
  else if(state.tab==="log") body = viewLog();
  else if(state.tab==="water") body = viewWater();
  else if(state.tab==="goals") body = viewGoals();
  else if(state.tab==="suggestions") body = viewSuggestions();
  else if(state.tab==="chat") body = viewChat();
  else if(state.tab==="reports") body = viewReports();
  else if(state.tab==="rewards") body = viewRewards();
  else if(state.tab==="profile") body = viewProfile();

  const nav = state.profile.onboarded ? `<nav class="navicons">${NAV_ITEMS.map(n=>`
    <button class="${state.tab===n.id?'active':''}" data-action="tab" data-val="${n.id}">${svgIcon(n.icon, state.tab===n.id)}<span>${n.label}</span></button>`).join("")}</nav>` : "";

  app.innerHTML = `
    <header class="top">
      <div style="display:flex; align-items:center; gap:10px;">
        ${LOGO_SVG}
        <div class="brand">Burzin<span>Eats</span></div>
      </div>
      <div style="display:flex; align-items:center; gap:10px;">
        ${state.profile.onboarded ? `<div class="streakpill">🔥 ${foodStreak()}</div>` : ""}
        ${currentUser ? `<button class="link-btn" data-action="signOut" style="font-size:12px">Sign out</button>` : ""}
      </div>
    </header>
    ${nav}
    <main>${body}</main>
    ${state.toast ? `<div class="toast">${escapeHtml(state.toast.text)}${state.toast.actionLabel ? `<button data-action="toastAction">${state.toast.actionLabel}</button>` : ""}</div>` : ""}
  `;

  if(document.getElementById('logInputBox')){
    document.getElementById('logInputBox').addEventListener('input', e=>{ state.logInput = e.target.value; });
    document.getElementById('logInputBox').addEventListener('keydown', e=>{ if(e.key==='Enter') handleAddFood(); });
  }
  if(document.getElementById('customWaterInput')){
    document.getElementById('customWaterInput').addEventListener('input', e=>{ state.customWaterMl = e.target.value; });
  }
  if(document.getElementById('chatInputBox')){
    document.getElementById('chatInputBox').addEventListener('input', e=>{ state.chatInput = e.target.value; });
    document.getElementById('chatInputBox').addEventListener('keydown', e=>{ if(e.key==='Enter') sendChatMessage(); });
  }
  if(state.tab==='chat') scrollChatToBottom();
  if(document.getElementById('reportFileInput')){
    document.getElementById('reportFileInput').addEventListener('change', e=>{
      const f = e.target.files[0]; if(f){ state.reportFile = f; state.reportFileName = f.name; render(); }
    });
  }
  if(document.getElementById('burnInputBox')){
    document.getElementById('burnInputBox').addEventListener('input', e=>{ state.burnInputVal = e.target.value; });
    document.getElementById('burnInputBox').addEventListener('keydown', e=>{ if(e.key==='Enter') handleAddBurn(); });
  }
  if(document.getElementById('healthFileInput')){
    document.getElementById('healthFileInput').addEventListener('change', e=>{
      const f = e.target.files[0]; if(f){ state.healthFile = f; state.healthFileName = f.name; render(); }
    });
  }
  if(document.getElementById('exerciseQueryBox')){
    document.getElementById('exerciseQueryBox').addEventListener('input', e=>{ state.exerciseQuery = e.target.value; });
    document.getElementById('exerciseQueryBox').addEventListener('keydown', e=>{ if(e.key==='Enter') searchExercise(); });
  }
  if(document.getElementById('exerciseMinutesBox')){
    document.getElementById('exerciseMinutesBox').addEventListener('input', e=>{ state.exerciseMinutes = e.target.value; });
  }
  if(document.getElementById('offBarcodeBox')){
    document.getElementById('offBarcodeBox').addEventListener('input', e=>{ state.offBarcodeInput = e.target.value; });
    document.getElementById('offBarcodeBox').addEventListener('keydown', e=>{ if(e.key==='Enter') offBarcodeLookup(); });
  }
  if(document.getElementById('offSearchBox')){
    document.getElementById('offSearchBox').addEventListener('input', e=>{ state.offSearchInput = e.target.value; });
    document.getElementById('offSearchBox').addEventListener('keydown', e=>{ if(e.key==='Enter') offSearch(); });
  }
  document.querySelectorAll('[data-grams-idx]').forEach(el=>{
    el.addEventListener('input', e=>{ const i = parseInt(el.dataset.gramsIdx); if(state.offResults && state.offResults[i]) state.offResults[i]._grams = e.target.value; });
  });
  document.querySelectorAll('[data-pending-field]').forEach(el=>{
    el.addEventListener('input', e=>{
      const i = parseInt(el.dataset.idx); const field = el.dataset.pendingField;
      if(!state.pendingItems || !state.pendingItems[i]) return;
      state.pendingItems[i][field] = field==='calories' ? toNum(e.target.value) : e.target.value;
    });
  });
  if(state.scanning) startScanner();
  bindProfileFields();
}

function bindProfileFields(){
  const map = {f_name:'name', f_age:'age', f_weight:'weightKg', f_height:'heightCm', f_activity:'activity', f_sex:'sex',
    f_region:'region', f_diet:'dietType', f_staple:'staple', f_spice:'spiceTolerance'};
  Object.entries(map).forEach(([id,key])=>{
    const el = document.getElementById(id);
    if(el) el.addEventListener('change', e=>{
      let v = e.target.value;
      if(['age','weightKg','heightCm'].includes(key)) v = parseFloat(v)||0;
      state.profileDraft[key] = v;
    });
  });
  const geminiKeyEl = document.getElementById('f_geminikey');
  if(geminiKeyEl) geminiKeyEl.addEventListener('input', e=>{ state.settingsDraft.geminiApiKey = e.target.value; });
}

document.getElementById('app').addEventListener('click', e=>{
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.dataset.action;
  if(action==='tab'){ if(state.scanning) stopScanner(); state.tab = el.dataset.val; state.addMsg=null; render(); }
  else if(action==='add'){ handleAddFood(); }
  else if(action==='voice'){ toggleVoice(); }
  else if(action==='del'){ deleteEntry(el.dataset.id); }
  else if(action==='delWater'){ deleteWater(el.dataset.id); }
  else if(action==='toastAction'){ if(state.toast && state.toast.onAction) state.toast.onAction(); state.toast = null; if(toastTimer) clearTimeout(toastTimer); render(); }
  else if(action==='toggleEntry'){ state.expandedEntry = (state.expandedEntry===el.dataset.id) ? null : el.dataset.id; render(); }
  else if(action==='suggest'){ handleGetSuggestions(); }
  else if(action==='addSuggestion'){ addSuggestionToLog(state.suggestions[parseInt(el.dataset.idx)]); }
  else if(action==='saveProfile'){ saveProfileDraft(); }
  else if(action==='chipCond'){ toggleCondition(el.dataset.val); }
  else if(action==='chipGoal'){ toggleGoal(el.dataset.val); }
  else if(action==='toggleAllNutrients'){ state.showAllNutrients = !state.showAllNutrients; render(); }
  else if(action==='water'){ addWater(parseInt(el.dataset.ml)); }
  else if(action==='customWater'){ addCustomWater(); }
  else if(action==='analyzeReport'){ analyzeReport(); }
  else if(action==='applyReport'){ applyReportToGoals(); }
  else if(action==='addBurn'){ handleAddBurn(); }
  else if(action==='delBurn'){ deleteBurned(el.dataset.id); }
  else if(action==='analyzeHealth'){ analyzeHealthImport(); }
  else if(action==='searchExercise'){ searchExercise(); }
  else if(action==='pickExercise'){ selectExercise(parseInt(el.dataset.idx)); }
  else if(action==='logExercise'){ logExerciseWorkout(); }
  else if(action==='offBarcode'){ offBarcodeLookup(); }
  else if(action==='offSearchBtn'){ offSearch(); }
  else if(action==='addOff'){ addOffProductToLog(parseInt(el.dataset.idx)); }
  else if(action==='toggleScan'){ toggleScan(); }
  else if(action==='stopScan'){ stopScanner(); render(); }
  else if(action==='saveSettings'){ state.settings = JSON.parse(JSON.stringify(state.settingsDraft)); saveSettings(); render(); }
  else if(action==='setTheme'){ setTheme(el.dataset.val); }
  else if(action==='sendChat'){ sendChatMessage(); }
  else if(action==='clearChat'){ clearChat(); }
  else if(action==='removePending'){ removePendingItem(parseInt(el.dataset.idx)); }
  else if(action==='confirmPending'){ confirmPendingItems(); }
  else if(action==='cancelPending'){ cancelPendingItems(); }
  else if(action==='signIn'){ signIn(); }
  else if(action==='signOut'){ signOutUser(); }
});

onAuthStateChanged(auth, (user)=>{
  if(user){
    currentUser = user;
    loadState();
  }else{
    currentUser = null;
    state.loaded = true;
    state.tab = "signin";
    render();
  }
});
render();
</script>
</body>
</html>
